plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

version = project.mod_version
group = project.maven_group
base { archivesName = project.archives_base_name }

repositories {
	// Mod Menu (optional: only used to add a "Config" button to Mod Menu's mod list)
	maven { url = "https://maven.terraformersmc.com/releases/" }
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
	compileOnly "com.terraformersmc:modmenu:${project.modmenu_version}"
	// so Mod Menu is there when testing with runClient, but it's not bundled into the jar
	localRuntime "com.terraformersmc:modmenu:${project.modmenu_version}"
}

// Automated in-game tests (./gradlew runClientGameTest). Not part of the mod jar.
fabricApi {
	configureTests {
		createSourceSet = true
		modId = "lyricraft-gametest"
		enableGameTests = false
		enableClientGameTests = true
		eula = true
	}
}

processResources {
	def version = project.version
	inputs.property "version", version
	filesMatching("fabric.mod.json") { expand "version": version }
}

tasks.withType(JavaCompile).configureEach { it.options.release = 25 }

java {
	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

jar { from("LICENSE") { rename { "${it}_lyricraft" } } }
